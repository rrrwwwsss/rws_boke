<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">Prefill Decode 分离推理架构</title>
  <desc id="desc">请求经过网关和调度器进入 Prefill 资源池，KV Cache 通过高速传输交给 Decode 资源池，输出 Token 返回用户。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#183b56" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60758a"/></marker>
    <style>.t{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#17324d}.h{font-size:32px;font-weight:800}.p{font-size:23px;fill:#52667a}.small{font-size:20px;fill:#6b7f92}.line{fill:none;stroke:#60758a;stroke-width:5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1500" height="720" fill="#f7f9fc"/>
  <text class="t h" x="750" y="60" text-anchor="middle">PD 分离：Prefill 与 Decode 使用独立资源池</text>
  <g filter="url(#shadow)">
    <rect x="45" y="265" width="205" height="145" rx="24" fill="#fff"/>
    <rect x="310" y="245" width="230" height="185" rx="24" fill="#fff"/>
    <rect x="615" y="115" width="300" height="310" rx="28" fill="#eaf4ff" stroke="#3586d6" stroke-width="3"/>
    <rect x="1040" y="115" width="300" height="430" rx="28" fill="#ecfaf5" stroke="#2e9f76" stroke-width="3"/>
    <rect x="1250" y="590" width="205" height="90" rx="22" fill="#fff"/>
  </g>
  <text class="t h" x="148" y="325" text-anchor="middle">用户请求</text><text class="t p" x="148" y="365" text-anchor="middle">Prompt / 参数</text>
  <text class="t h" x="425" y="305" text-anchor="middle">网关与调度器</text><text class="t p" x="425" y="350" text-anchor="middle">选择 P / D Worker</text><text class="t small" x="425" y="390" text-anchor="middle">路由 · 排队 · 背压</text>
  <text class="t h" x="765" y="170" text-anchor="middle">Prefill 资源池</text>
  <rect x="660" y="205" width="210" height="70" rx="16" fill="#fff"/><text class="t p" x="765" y="248" text-anchor="middle">P Worker 1</text>
  <rect x="660" y="292" width="210" height="70" rx="16" fill="#fff"/><text class="t p" x="765" y="335" text-anchor="middle">P Worker N</text>
  <text class="t small" x="765" y="397" text-anchor="middle">处理 Prompt · 生成 KV</text>
  <text class="t h" x="1190" y="170" text-anchor="middle">Decode 资源池</text>
  <rect x="1085" y="205" width="210" height="70" rx="16" fill="#fff"/><text class="t p" x="1190" y="248" text-anchor="middle">D Worker 1</text>
  <rect x="1085" y="292" width="210" height="70" rx="16" fill="#fff"/><text class="t p" x="1190" y="335" text-anchor="middle">D Worker N</text>
  <text class="t small" x="1190" y="397" text-anchor="middle">读取 KV · 逐 Token 生成</text>
  <rect x="1085" y="440" width="210" height="60" rx="16" fill="#d8f4e8"/><text class="t small" x="1190" y="478" text-anchor="middle">KV Cache Block 管理</text>
  <path class="line" d="M250 338H310"/><path class="line" d="M540 305H615"/>
  <path class="line" d="M915 250H1040"/><text class="t p" x="977" y="220" text-anchor="middle">KV Cache</text><text class="t small" x="977" y="285" text-anchor="middle">RDMA / NVLink / 高速网络</text>
  <path class="line" d="M1340 355C1435 355 1435 635 1455 635"/><text class="t p" x="1352" y="637" text-anchor="end">Token 流</text>
  <path class="line" d="M1250 635C620 635 300 515 190 410"/>
  <text class="t h" x="1352" y="645" text-anchor="middle">输出</text>
  <text class="t small" x="750" y="685" text-anchor="middle">P 池优化 TTFT　·　D 池优化 TPOT / ITL　·　调度器平衡两侧负载</text>
</svg>
