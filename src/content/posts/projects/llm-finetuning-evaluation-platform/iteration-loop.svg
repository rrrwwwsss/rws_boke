<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#155eef"/></marker></defs>
  <rect width="1600" height="760" fill="#101828"/>
  <text x="80" y="85" font-family="Microsoft YaHei, sans-serif" font-size="38" font-weight="800" fill="#fff">从一次误报，到下一版模型</text>
  <text x="80" y="126" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#aab2c0">让生产问题进入可追踪、可复现、可比较的迭代闭环</text>
  <g font-family="Microsoft YaHei, sans-serif">
    <g fill="#fff"><rect x="80" y="235" width="210" height="180"/><rect x="325" y="235" width="210" height="180"/><rect x="570" y="235" width="210" height="180"/><rect x="815" y="235" width="210" height="180"/><rect x="1060" y="235" width="210" height="180"/></g>
    <rect x="1305" y="235" width="215" height="180" fill="#155eef"/>
    <g font-size="18" fill="#155eef"><text x="105" y="275">01 / 发现</text><text x="350" y="275">02 / 回流</text><text x="595" y="275">03 / 训练</text><text x="840" y="275">04 / 评测</text><text x="1085" y="275">05 / 复核</text><text x="1330" y="275" fill="#dbe7ff">06 / 发布</text></g>
    <g font-size="25" font-weight="700" fill="#101828"><text x="105" y="330">生产误报</text><text x="105" y="365">或漏报</text><text x="350" y="330">困难样本</text><text x="350" y="365">标注入库</text><text x="595" y="330">新一轮</text><text x="595" y="365">LoRA 微调</text><text x="840" y="330">统一测试集</text><text x="840" y="365">批量推理</text><text x="1085" y="330">指标与错误</text><text x="1085" y="365">样本分析</text></g>
    <g font-size="25" font-weight="700" fill="#fff"><text x="1330" y="330">更新生产</text><text x="1330" y="365">Adapter</text></g>
  </g>
  <g stroke="#155eef" stroke-width="5" marker-end="url(#b)"><path d="M290 325h30"/><path d="M535 325h30"/><path d="M780 325h30"/><path d="M1025 325h30"/><path d="M1270 325h30"/></g>
  <path d="M1410 415v120H185V425" fill="none" stroke="#ff6b35" stroke-width="5" marker-end="url(#b)"/>
  <text x="600" y="585" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#fff">持续运行产生新样本，模型迭代不是一次性训练</text>
  <text x="80" y="690" font-family="monospace" font-size="19" fill="#8f98a8">RUN → REVIEW → LABEL → TRAIN → EVALUATE → RELEASE → RUN</text>
</svg>
