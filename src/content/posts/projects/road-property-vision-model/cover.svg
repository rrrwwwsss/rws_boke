<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">公路违法行为智能识别系统</title>
  <desc id="desc">摄像头图像经过多模态大模型、业务规则和人工复核形成执法线索</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152e"/>
      <stop offset="0.58" stop-color="#0b3a73"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1360" cy="120" r="260" fill="#38bdf8" opacity=".10"/>
  <circle cx="1230" cy="760" r="330" fill="#2dd4bf" opacity=".12"/>
  <path d="M990 900 1290 310 1590 900Z" fill="url(#road)" opacity=".95"/>
  <path d="M1289 835 1303 835 1308 754 1281 754Z" fill="#f8fafc" opacity=".88"/>
  <path d="M1273 698 1315 698 1324 565 1263 565Z" fill="#f8fafc" opacity=".88"/>
  <rect x="1070" y="360" width="360" height="240" rx="22" fill="none" stroke="#fb7185" stroke-width="10"/>
  <path d="M1070 405h-42v-45M1430 405h42v-45M1070 555h-42v45M1430 555h42v45" fill="none" stroke="#fb7185" stroke-width="10"/>
  <g filter="url(#shadow)">
    <rect x="90" y="100" width="770" height="610" rx="34" fill="#ffffff" opacity=".96"/>
  </g>
  <rect x="145" y="155" width="96" height="12" rx="6" fill="#0ea5e9"/>
  <text x="145" y="250" fill="#0f172a" font-family="Microsoft YaHei, sans-serif" font-size="70" font-weight="700">公路违法行为</text>
  <text x="145" y="340" fill="#0f172a" font-family="Microsoft YaHei, sans-serif" font-size="70" font-weight="700">智能识别系统</text>
  <text x="145" y="415" fill="#475569" font-family="Microsoft YaHei, sans-serif" font-size="30">从视觉大模型到非现场执法线索闭环</text>
  <g font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="600">
    <rect x="145" y="485" width="160" height="56" rx="28" fill="#dbeafe"/><text x="187" y="521" fill="#1d4ed8">Qwen-VL</text>
    <rect x="325" y="485" width="130" height="56" rx="28" fill="#ccfbf1"/><text x="363" y="521" fill="#0f766e">LoRA</text>
    <rect x="475" y="485" width="170" height="56" rx="28" fill="#ffedd5"/><text x="511" y="521" fill="#c2410c">业务规则</text>
    <rect x="665" y="485" width="140" height="56" rx="28" fill="#fce7f3"/><text x="700" y="521" fill="#be185d">人工复核</text>
  </g>
  <text x="145" y="635" fill="#64748b" font-family="Consolas, monospace" font-size="23">IMAGE → MODEL → RULES → EVIDENCE → CLUE</text>
</svg>
