<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 620" role="img" aria-labelledby="title desc">
  <title id="title">LoRA 的主要优势</title><desc id="desc">击穿显存墙、计算量锐减、通信带宽减负、零推理延迟</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#243b53" flood-opacity=".12"/></filter><style>.t{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#243b53}.h{font-size:34px;font-weight:800}.p{font-size:23px;fill:#52667a}.i{font-size:44px;font-weight:800}.line{stroke-width:7;stroke-linecap:round}</style></defs>
  <rect width="1800" height="620" fill="#f6f8fb"/>
  <g filter="url(#s)"><rect x="35" y="35" width="410" height="550" rx="26" fill="#fff"/><rect x="475" y="35" width="410" height="550" rx="26" fill="#fff"/><rect x="915" y="35" width="410" height="550" rx="26" fill="#fff"/><rect x="1355" y="35" width="410" height="550" rx="26" fill="#fff"/></g>
  <line class="line" x1="55" y1="38" x2="425" y2="38" stroke="#418fde"/><text class="t i" x="75" y="125" fill="#418fde">▤</text><text class="t h" x="75" y="190">1. 击穿显存墙</text><text class="t p" x="75" y="245"><tspan x="75">全量微调最大的关键是保存海量</tspan><tspan x="75" dy="40">参数的梯度和 Adam 状态。</tspan><tspan x="75" dy="40">LoRA 冻结了基础参数，让显存</tspan><tspan x="75" dy="40">消耗降低至原来的几分之一</tspan><tspan x="75" dy="40">甚至更低，彻底打破 OOM 魔咒。</tspan></text>
  <line class="line" x1="495" y1="38" x2="865" y2="38" stroke="#36ae91"/><text class="t i" x="515" y="125" fill="#36ae91">◴</text><text class="t h" x="515" y="190">2. 计算量（FLOPs）锐减</text><text class="t p" x="515" y="245"><tspan x="515">前向计算基本不变，但在反向</tspan><tspan x="515" dy="40">传播时，庞大的基座权重不需</tspan><tspan x="515" dy="40">要再参与复杂的梯度计算，这</tspan><tspan x="515" dy="40">大幅削减了浮点运算次数，显</tspan><tspan x="515" dy="40">著提升训练吞吐。</tspan></text>
  <line class="line" x1="935" y1="38" x2="1305" y2="38" stroke="#e7a91c"/><text class="t i" x="955" y="125" fill="#e7a91c">⌘</text><text class="t h" x="955" y="190">3. 通信带宽减负</text><text class="t p" x="955" y="245"><tspan x="955">在多卡分布式训练中（如 DDP），</tspan><tspan x="955" dy="40">GPU 间需要频繁同步梯度。</tspan><tspan x="955" dy="40">LoRA 的极少参数量使得</tspan><tspan x="955" dy="40">All-Reduce 同步数据量呈指数</tspan><tspan x="955" dy="40">级下降，网络不再卡脖子。</tspan></text>
  <line class="line" x1="1375" y1="38" x2="1745" y2="38" stroke="#8f6ddd"/><text class="t i" x="1395" y="125" fill="#8f6ddd">♦</text><text class="t h" x="1395" y="190">4. 零推理延迟</text><text class="t p" x="1395" y="245"><tspan x="1395">工程落地的神来之笔！部署时</tspan><tspan x="1395" dy="40">利用数学分配律，将 B×A 提前</tspan><tspan x="1395" dy="40">加回原始权重中。部署推理时</tspan><tspan x="1395" dy="40">计算量与原模型 100% 一致，</tspan><tspan x="1395" dy="40">没有任何额外开销。</tspan></text>
</svg>
