<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 600" role="img" aria-labelledby="title desc">
  <title id="title">其他微调算法迭代</title><desc id="desc">DoRA、AdaLoRA、QLoRA 与 LoRAHub 或 MoE</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#243b53" flood-opacity=".11"/></filter><style>.t{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#243b53}.h{font-size:36px;font-weight:800}.label{font-size:18px;font-weight:700}.p{font-size:23px;fill:#52667a}.strong{font-weight:800;fill:#243b53}</style></defs>
  <rect width="1800" height="600" fill="#f6f8fb"/><g filter="url(#s)"><rect x="35" y="35" width="410" height="530" rx="25" fill="#fff"/><rect x="475" y="35" width="410" height="530" rx="25" fill="#fff"/><rect x="915" y="35" width="410" height="530" rx="25" fill="#fff"/><rect x="1355" y="35" width="410" height="530" rx="25" fill="#fff"/></g>
  <rect x="35" y="35" width="8" height="530" rx="4" fill="#3182bd"/><circle cx="90" cy="100" r="28" fill="#3182bd"/><text x="90" y="110" text-anchor="middle" fill="#fff" font-size="30">◆</text><rect x="335" y="68" width="80" height="32" rx="16" fill="#d9f0ff"/><text class="t label" x="375" y="90" text-anchor="middle" fill="#1670aa">锦上花</text><text class="t h" x="75" y="170">DoRA</text><text class="t p" x="75" y="230"><tspan class="strong">解法：</tspan><tspan>将权重更新精妙拆解为</tspan><tspan x="75" dy="39">“幅度”和“方向”。</tspan><tspan x="75" dy="55" class="strong">效果：</tspan><tspan>用 LoRA 模式更新方</tspan><tspan x="75" dy="39">向，单独学习幅度向量。学习</tspan><tspan x="75" dy="39">轨迹无限逼近全量微调，打破</tspan><tspan x="75" dy="39">能力天花板。</tspan></text>
  <rect x="475" y="35" width="8" height="530" rx="4" fill="#c055d5"/><circle cx="530" cy="100" r="28" fill="#c055d5"/><text x="530" y="110" text-anchor="middle" fill="#fff" font-size="30">✦</text><rect x="775" y="68" width="80" height="32" rx="16" fill="#f7ddfb"/><text class="t label" x="815" y="90" text-anchor="middle" fill="#a33ab7">动态秩</text><text class="t h" x="515" y="170">AdaLoRA</text><text class="t p" x="515" y="230"><tspan class="strong">解法：</tspan><tspan>引入动态秩分配机制。</tspan><tspan x="515" dy="55" class="strong">效果：</tspan><tspan>基于奇异值重要性打</tspan><tspan x="515" dy="39">分，自动给关键层分配高</tspan><tspan x="515" dy="39">Rank，剪枝无关层。好钢全用</tspan><tspan x="515" dy="39">在刀刃上，彻底告别盲目调</tspan><tspan x="515" dy="39">参。</tspan></text>
  <rect x="915" y="35" width="8" height="530" rx="4" fill="#e46b53"/><circle cx="970" cy="100" r="28" fill="#e46b53"/><text x="970" y="110" text-anchor="middle" fill="#fff" font-size="30">⌗</text><rect x="1215" y="68" width="80" height="32" rx="16" fill="#ffe4de"/><text class="t label" x="1255" y="90" text-anchor="middle" fill="#be4932">极省显存</text><text class="t h" x="955" y="170">QLoRA</text><text class="t p" x="955" y="230"><tspan class="strong">解法：</tspan><tspan>基座权重压缩至 4-bit</tspan><tspan x="955" dy="39">（NF4）数据类型，配合分页优</tspan><tspan x="955" dy="39">化器。</tspan><tspan x="955" dy="55" class="strong">效果：</tspan><tspan>极致空间压缩！单</tspan><tspan x="955" dy="39">张消费级显卡也能跑动超大规</tspan><tspan x="955" dy="39">模模型微调。</tspan></text>
  <rect x="1355" y="35" width="8" height="530" rx="4" fill="#d9a51d"/><circle cx="1410" cy="100" r="28" fill="#d9a51d"/><text x="1410" y="110" text-anchor="middle" fill="#fff" font-size="30">✚</text><rect x="1655" y="68" width="80" height="32" rx="16" fill="#fff1c7"/><text class="t label" x="1695" y="90" text-anchor="middle" fill="#9f7710">多任务</text><text class="t h" x="1395" y="170">LoRAHub / MoE</text><text class="t p" x="1395" y="230"><tspan class="strong">解法：</tspan><tspan>训练多个独立的特定领</tspan><tspan x="1395" dy="39">域专家适配器。</tspan><tspan x="1395" dy="55" class="strong">效果：</tspan><tspan>推理时动态路由或权重</tspan><tspan x="1395" dy="39">合并，模型化身“变形金刚”，</tspan><tspan x="1395" dy="39">先解决多任务灾难性遗忘。</tspan></text>
</svg>
